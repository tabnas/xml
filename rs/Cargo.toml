[package]
name = "tabnas-xml"
version = "0.7.14"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "XML 1.0 grammar plugin for the tabnas parsing engine, with namespaces and entities"
repository = "https://github.com/tabnas/xml"

[lib]
name = "tabnas_xml"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. `make`, `make_with` and `parse` build on it alone.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
indexmap = "2"
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner: one loader in three languages, so
# the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The relaxed-JSON grammar, for the tests only: they read
# xml-grammar.jsonic with it, run the fixtures on a jsonic parser as the
# TypeScript and Go suites do, and exercise embed mode, which needs a
# jsonic parser to embed XML in. Clone https://github.com/tabnas/jsonic
# next to this repo; it brings tabnas-json from ../../json/rs.
tabnas-jsonic = { path = "../../jsonic/rs" }
